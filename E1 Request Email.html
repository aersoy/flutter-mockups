    contracts expiring in the nine months after launch, and the proposed attachment columns
    (to confirm with Flutter: their rules file lists filters only). The extract is read at
    launch, so its date is the launch date.

  IA CHANGE BRIEF, 2026-10-12 (D29 revised: RU 4.2.1 Option 1 as written)
    The launch email's attachment lists every contract of the Purchasing Group ending in the
    window, including ones already in the plan. No matching, so no 'not yet in the plan'.

  IA CHANGE BRIEF, 2026-10-11 (D2 deferred, D25, D28, D29, Q29)
    A second variant beside the owner email: the launch email RU 4.2 describes, one per
    Purchasing Group, to its Starters and copying its Requestor, with a link to the group's
    lines and the Contract_Data extract of expiring contracts attached (D29). The
    owner email stays, since D2 is deferred until Flutter confirms the email path (Q28).
    Owner answers now go to the Requestor for approval once they pass validation (D25, Q29),
    and a confirmed cancel goes for approval too (D8). "Freeze" reads "submissions close" (D28).

  IA CHANGE BRIEF, 2026-10-09: the links sign in with SSO or an email code (D2, D7). Replies
  and returned workbooks stay valid without signing in. Otherwise unchanged (D17).

  E1 · The Request Email  (Flutter Purchase Planning Agent, Phase 1)
  ==================================================================
  Source: `Tiered Solution/Scope and Flow.md` → "Reaching Business Units Where They Already Are"
          `Tiered Solution/Screen Inventory.md` → "E1. The request email"

  SESSION 22 MODEL: light login. Answering happens signed in, with one click on a
  Microsoft work account, because an unauthenticated answer is a security problem and
  makes the audit trail disputable. Every line keeps its four answers as links in the
  email: each is a deep link that goes through the one-click sign-in and lands on that
  line with the answer preselected (E2). So answering stays two clicks, and every answer
  is attributed to a signed-in person.

  Two channels stay open without the platform, because they are authenticated elsewhere:
  a plain reply, which the owner's own mail server has already authenticated, and, for
  large sets, the attached workbook sent back to the thread. A cancel arriving either way
  is confirmed with one click before it takes effect, because free text can be misread.

  Constraints this mockup honours:
    - Survives Outlook: tables, no flexbox-dependent layout in the real send.
    - Internal mail, not a marketing send: no hero image, no banner, no full-width button.
    - One thread per owner per cycle, never one per line (deterministic RFC 5322 root).
    - No rule citations anywhere in the message (Session 22): the decision date is shown,
      the notice period and procedure that produce it are not.

  The sender domain shown is the Flutter one we intend to argue for; SPF and DKIM on
  their side is the cost. Recorded in Scope and Flow, not on screen.

  Session 24: E1b (the collection workbook) was merged into this file. The View switch
  shows the Request email, the Workbook attached to it for large sets, and Ellie's reply
  On return. Session 25: all three views follow the Owner set size switch. The 4-line set
  is Marco Ferretti's, the 63-line set Alessandro Conti's, in every view. The workbook is
  now attached to the 4-line email too, as an alternative to the links, so the Workbook
  and On return views exist for both sizes. The page is centered and the width capped.

  The workbook's own reasoning, carried from E1b: same columns as the platform grid;
  versioned per owner per cycle and reconciled on return; structure protected (locked
  details, open answer columns, dropdown vocabulary); Ellie replies in the thread on
  receipt, which is the challenge loop; attribution from the owner's own mailbox; a
  cancel in a cell is confirmed with one click before it takes effect.

  Stack: Tailwind CDN + Alpine.js CDN + IBM Plex Sans.
  Alpine rule: no double quotes inside the x-data attribute value.
-->

  <div>

        <div class="flex gap-1.5">

  <!-- ══════════════════════════ WORKBOOK VIEW ══════════════════════════ -->
  <template x-if="kind === 'To an owner' && view === 'Workbook'">
    <div>

      <div class="rounded-xl bg-white border border-slate-300 shadow-sm overflow-hidden">

        <!-- Excel-ish chrome -->

          <span class="text-white text-[12px] font-medium" x-text="wbName()"></span>
          <span class="text-white/70 text-[11px]">Excel</span>
        </div>

            <li>Send the file back as a reply to the email it came with. Do not rename it.</li>

              </thead>

                        :class="r.urgent ? 'text-amber-700' : ''" x-text="r.decide"></td>

             The add-a-line capability, in the workbook. Same path as the platform:

        <template x-if="sheet === 'Lines we are missing'">
