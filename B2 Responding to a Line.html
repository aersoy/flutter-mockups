<!DOCTYPE html>
<!--
  B2 · Responding To A Line  (business unit owner, in the platform)  Phase 1
  ==========================================================================
  Source: `Tiered Solution/Screen Inventory.md` → "B2. Responding to a line"
          `Tiered Solution/Scope and Flow.md`   → "A response answers two questions, not one",
                                                  "The challenge loop is the comment thread"

  What it has to prove:
    Answering is two short questions, not a form.

  How this differs from E2, which asks the same two questions:
    E2 is the focused page an email button lands on after the one-click sign-in: this
    cycle's set, nothing else.
    B2 is the same answer inside the app, where the owner also gets:
      - the line's full history, including how it was answered in previous cycles
      - THE THREAD, which is the challenge loop and the clarification conversation in
        one place, replacing the six-inbox version that exists today
      - the audit trail, recording who changed what, on what basis, and through which
        channel, rather than presenting every response as though it were authenticated
      - delegation as a normal action available at any time, not only at escalation
    The answer controls are deliberately IDENTICAL in both places. Nobody should have
    to learn two vocabularies.

  The framework agreement follow-up is again the moment worth demoing: it is the first
  decision in Flutter's own RFE process, Phase 1 has to ask a human, and Phase 2
  answers it from contract data.

  The spot check on a stale confirmation is what keeps "confirm is one click" honest:
  confirming without reading has a cost, without making confirming expensive for everyone.

  Session 22: explanatory annotations removed from the page, no rule citations.

  Stack: Tailwind CDN + Alpine.js CDN + IBM Plex Sans.
  Alpine rule: no double quotes inside the x-data attribute value.
-->
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 · Responding to a Line</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  [x-cloak] { display: none !important; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #d7d7de; border-radius: 8px; }
  .fade { animation: f .2s ease-out; }
  @keyframes f { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>

<body class="bg-gray-100 h-screen overflow-hidden text-slate-800" x-data="respond()" x-cloak>
<div class="flex h-screen">

  <nav class="w-14 bg-white border-r border-gray-200 flex flex-col items-center py-4 gap-2 shrink-0">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center mb-3">
      <span class="text-white text-xs font-bold">E</span>
    </div>
    <button class="w-10 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 text-[8px] bg-indigo-50 text-indigo-600 font-semibold">
      <span class="text-[15px]">☑</span><span>My lines</span>
    </button>
    <button class="w-10 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 text-[8px] text-gray-400 hover:bg-gray-100">
      <span class="text-[15px]">▤</span><span>Plan</span>
    </button>
    <div class="flex-1"></div>
    <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 text-[10px] font-semibold flex items-center justify-center">AC</div>
  </nav>

  <div class="flex-1 flex flex-col min-w-0">

    <!-- ══════════ Line header ══════════ -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 shrink-0">
      <div class="flex items-start justify-between gap-6">
        <div class="min-w-0">
          <div class="flex items-center gap-2 text-[11px] text-gray-400 mb-1">
            <button class="hover:text-gray-600">My lines</button><span>/</span>
            <span class="mono">PP-2027-1042</span>
          </div>
          <h1 class="text-lg font-semibold text-gray-900">Observability platform</h1>
          <p class="text-[12px] text-gray-500 mt-0.5">
            Grafana Labs · Sisal Gaming · Platform Engineering · Technology
          </p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <!-- Delegation is a normal action, available now, not an escalation step.
               Getting a line to the right person early is what stops it going late. -->
          <button class="px-3 py-1.5 text-xs font-medium text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50">Delegate</button>
          <button class="px-3 py-1.5 text-xs font-medium text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50">History</button>
          <button class="px-3 py-1.5 text-xs font-medium text-gray-600 hover:text-gray-900">Next line &rarr;</button>
        </div>
      </div>
    </header>

    <div class="flex-1 flex min-h-0">

      <!-- ══════════════════ Left: the answer ══════════════════ -->
      <div class="scroll flex-1 overflow-y-auto px-6 py-5 min-w-0">

        <!-- Facts. Everything needed to answer without opening anything else. -->
        <div class="grid grid-cols-5 gap-px bg-gray-200 rounded-xl overflow-hidden border border-gray-200 mb-5">
          <template x-for="f in facts" :key="f.k">
            <div class="bg-white px-3.5 py-3">
              <div class="text-[10px] text-gray-400 uppercase tracking-wide" x-text="f.k"></div>
              <div class="text-[13px] font-medium mt-0.5" :class="f.tone || 'text-gray-900'" x-text="f.v"></div>
            </div>
          </template>
        </div>

        <!-- ── QUESTION 1 ── -->
        <div class="flex items-baseline gap-2">
          <span class="w-5 h-5 rounded-full bg-slate-800 text-white text-[10px] font-semibold flex items-center justify-center shrink-0">1</span>
          <h2 class="text-[15px] font-semibold text-gray-900">Is this still going ahead?</h2>
        </div>
        <div class="grid grid-cols-4 gap-2.5 mt-3">
          <template x-for="o in realOptions" :key="o.k">
            <button @click="pickReal(o.k)"
                    class="text-left rounded-lg border-2 px-3.5 py-3 transition-all"
                    :class="real === o.k
                      ? (o.k === 'cancel' ? 'border-rose-500 bg-rose-50' : 'border-indigo-600 bg-indigo-50')
                      : 'border-gray-200 bg-white hover:border-gray-300'">
              <div class="text-[13px] font-semibold"
                   :class="real === o.k ? (o.k === 'cancel' ? 'text-rose-800' : 'text-indigo-800') : 'text-gray-800'"
                   x-text="o.label"></div>
              <div class="text-[11px] text-gray-500 mt-0.5 leading-snug" x-text="o.hint"></div>
            </button>
          </template>
        </div>

        <!-- ── The stale-confirmation spot check ──
             This is what stops "confirm is one click" degrading into a rubber stamp.
             It fires on evidence, not on every confirmation. -->
        <template x-if="real === 'confirm'">
          <div class="fade mt-4 rounded-xl border border-amber-200 bg-amber-50 p-4 flex gap-3">
            <div class="w-6 h-6 rounded-full shrink-0 flex items-center justify-center text-white text-[10px] font-bold"
                 style="background: linear-gradient(135deg,#818cf8,#4f46e5)">E</div>
            <div class="min-w-0">
              <div class="text-[12.5px] font-semibold text-amber-900">Worth a second look before you confirm</div>
              <p class="text-[12px] text-amber-900/90 mt-1 leading-relaxed">
                The value on this line has not changed across three cycles, and the supplier field has
                not been touched since the line was created in March 2024. If that is right, confirm and
                I will stop asking. If it is not, tell me what changed.
              </p>
              <div class="flex gap-2 mt-2.5">
                <button class="text-[11.5px] font-semibold px-3 py-1.5 rounded-md bg-amber-600 text-white">It is right, confirm</button>
                <button @click="pickReal('changes')" class="text-[11.5px] font-medium px-3 py-1.5 rounded-md bg-white border border-amber-300 text-amber-800">Actually, it changed</button>
              </div>
            </div>
          </div>
        </template>

        <template x-if="real === 'cancel'">
          <div class="fade mt-4 rounded-xl border-2 border-rose-200 bg-rose-50/60 p-4">
            <div class="text-[13px] font-semibold text-rose-900">Why is this being canceled?</div>
            <p class="text-[12px] text-rose-800/80 mt-1 leading-relaxed">
              Required. The line is not deleted: Procurement reviews it with the other canceled lines
              at the freeze.
            </p>
            <select class="mt-2.5 w-full max-w-sm text-[13px] px-3 py-2 border border-rose-300 rounded-lg bg-white">
              <option>Select a reason...</option>
              <option>Service no longer required</option><option>Moved in-house</option>
              <option>Covered by another contract</option><option>Budget withdrawn</option>
              <option>Duplicate of another plan line</option><option>Other</option>
            </select>
          </div>
        </template>

        <template x-if="real === 'notmine'">
          <div class="fade mt-4 rounded-xl border border-gray-200 bg-gray-50 p-4">
            <div class="text-[13px] font-semibold text-gray-900">Who should have this?</div>
            <p class="text-[12px] text-gray-600 mt-1 leading-relaxed">
              It goes straight to them, without routing back through Procurement.
            </p>
            <input type="text" placeholder="Search people in Platform Engineering..."
                   class="mt-2.5 w-full max-w-sm text-[13px] px-3 py-2 border border-gray-300 rounded-lg">
          </div>
        </template>

        <!-- ── QUESTION 2 ── -->
        <template x-if="real === 'confirm' || real === 'changes'">
          <div class="fade mt-6">
            <div class="flex items-baseline gap-2">
              <span class="w-5 h-5 rounded-full bg-slate-800 text-white text-[10px] font-semibold flex items-center justify-center shrink-0">2</span>
              <h2 class="text-[15px] font-semibold text-gray-900">How will it be bought?</h2>
            </div>
            <div class="grid grid-cols-2 gap-2.5 mt-3">
              <template x-for="o in routeOptions" :key="o.k">
                <button @click="pickRoute(o.k)"
                        class="text-left rounded-lg border-2 px-3.5 py-3 transition-all"
                        :class="route === o.k ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 bg-white hover:border-gray-300'">
                  <div class="text-[13px] font-semibold" :class="route === o.k ? 'text-indigo-800' : 'text-gray-800'" x-text="o.label"></div>
                  <div class="text-[11px] text-gray-500 mt-0.5 leading-snug" x-text="o.hint"></div>
                </button>
              </template>
            </div>
          </div>
        </template>

        <!-- ── The framework agreement branch ── -->
        <template x-if="route === 'framework'">
          <div class="fade mt-4 rounded-xl border-2 border-violet-200 bg-violet-50/60 p-4">
            <div class="text-[13px] font-semibold text-violet-900">
              Can the PO value be determined without requesting a quote from the supplier?
            </div>
            <div class="flex gap-2.5 mt-3">
              <button @click="poValue = 'yes'" class="text-[13px] font-semibold px-4 py-2 rounded-lg border-2 transition-all"
                      :class="poValue === 'yes' ? 'border-violet-600 bg-violet-600 text-white' : 'border-violet-300 bg-white text-violet-800'">Yes</button>
              <button @click="poValue = 'no'" class="text-[13px] font-semibold px-4 py-2 rounded-lg border-2 transition-all"
                      :class="poValue === 'no' ? 'border-violet-600 bg-violet-600 text-white' : 'border-violet-300 bg-white text-violet-800'">No</button>
            </div>

            <!-- Showing the routing consequence back to the user is the moment it stops
                 feeling like a form and starts feeling like the agent is doing something. -->
            <template x-if="poValue">
              <div class="fade mt-3 rounded-lg bg-white border border-violet-200 px-3.5 py-3">
                <div class="text-[12px] font-semibold text-violet-900" x-text="poValue === 'yes' ? 'This line skips the RFE' : 'This is case 1A: RFE still required'"></div>
                <p class="text-[12px] text-violet-900/90 mt-1 leading-relaxed"
                   x-text="poValue === 'yes'
                     ? 'It routes to a Purchase Request instead. The RFE cycle is skipped, there is no negotiation to schedule, and nothing further is needed from you on this line.'
                     : 'It goes to RFE. Before the notice window opens I will send you the hand-off pack with every field the Appian form needs, so it is complete on first submission.'"></p>
              </div>
            </template>
          </div>
        </template>

        <template x-if="real === 'changes'">
          <div class="fade mt-4 rounded-xl border border-gray-200 bg-gray-50 p-4">
            <div class="text-[13px] font-semibold text-gray-900">What has changed?</div>
            <div class="grid grid-cols-2 gap-3 mt-3 max-w-2xl">
              <template x-for="c in changeFields" :key="c.k">
                <div>
                  <label class="text-[11px] text-gray-500" x-text="c.k"></label>
                  <input type="text" :value="c.v" class="mt-1 w-full text-[13px] px-3 py-2 border border-gray-300 rounded-lg">
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Submit -->
        <div class="mt-6 pt-5 border-t border-gray-200 flex items-center justify-between max-w-4xl">
          <span class="text-[11.5px] text-gray-500">
            You can change this answer until the freeze on 16 October.
          </span>
          <div class="flex gap-2">
            <button class="text-[13px] font-medium px-4 py-2.5 rounded-lg bg-white border border-gray-300 text-gray-700">Save and next</button>
            <button :disabled="!canSubmit()"
                    class="text-[13px] font-semibold px-5 py-2.5 rounded-lg transition-colors"
                    :class="canSubmit() ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed'">
              Send answer
            </button>
          </div>
        </div>
      </div>

      <!-- ══════════════════ Right: the thread and the trail ══════════════════
           "The challenge loop is the comment thread." Not a separate feature bolted
           on: it is the shape the validation loop already has. Procurement and the
           business unit add to the same thread, and both sides see both sides. -->
      <aside class="w-[380px] border-l border-gray-200 bg-white flex flex-col shrink-0">
        <div class="flex border-b border-gray-200 shrink-0">
          <template x-for="t in ['Thread', 'Audit trail', 'Previous cycles']" :key="t">
            <button @click="pane = t"
                    class="flex-1 text-[12px] font-medium py-2.5 border-b-2 transition-colors"
                    :class="pane === t ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                    x-text="t"></button>
          </template>
        </div>

        <!-- Thread -->
        <template x-if="pane === 'Thread'">
          <div class="scroll flex-1 overflow-y-auto p-4 space-y-3">
            <div class="text-[10.5px] text-gray-400 text-center pb-1">
              This is the same conversation as the email thread for this cycle
            </div>
            <template x-for="m in thread" :key="m.i">
              <div class="flex gap-2.5" :class="m.who === 'ellie' ? '' : 'flex-row-reverse'">
                <div class="w-6 h-6 rounded-full shrink-0 flex items-center justify-center text-[9px] font-bold text-white"
                     :style="m.who === 'ellie' ? 'background: linear-gradient(135deg,#818cf8,#4f46e5)' : ''"
                     :class="m.who === 'ellie' ? '' : (m.who === 'proc' ? 'bg-slate-600' : 'bg-emerald-600')"
                     x-text="m.init"></div>
                <div class="min-w-0 max-w-[88%]">
                  <div class="rounded-xl px-3 py-2 text-[12px] leading-relaxed border"
                       :class="m.who === 'ellie' ? 'bg-indigo-50 border-indigo-100 text-slate-800'
                             : (m.who === 'proc' ? 'bg-slate-50 border-slate-200 text-slate-800'
                             : 'bg-emerald-50 border-emerald-100 text-slate-800')"
                       x-html="m.body"></div>
                  <div class="text-[10px] text-gray-400 mt-1" :class="m.who === 'ellie' ? '' : 'text-right'" x-text="m.meta"></div>
                </div>
              </div>
            </template>

            <div class="pt-2">
              <textarea rows="2" placeholder="Reply in the thread..."
                        class="w-full text-[12px] px-3 py-2 border border-gray-300 rounded-lg resize-none"></textarea>
              <div class="text-[10px] text-gray-400 mt-1">
                Procurement can see and add to this thread. So can you, by replying to the email.
              </div>
            </div>
          </div>
        </template>

        <!-- Audit trail. Records the CHANNEL and the BASIS of attribution, rather
             than presenting every response as though it were authenticated. -->
        <template x-if="pane === 'Audit trail'">
          <div class="scroll flex-1 overflow-y-auto p-4">
            <div class="text-[11px] text-gray-500 leading-relaxed mb-3 pb-3 border-b border-gray-100">
              Every entry records who made the change and how it arrived: signed in, an email
              reply from the owner's mailbox, or a returned workbook.
            </div>
            <div class="space-y-3">
              <template x-for="a in audit" :key="a.i">
                <div class="flex gap-2.5">
                  <div class="w-1.5 h-1.5 rounded-full mt-1.5 shrink-0" :class="a.tone"></div>
                  <div class="min-w-0">
                    <div class="text-[12px] text-slate-800 leading-snug" x-html="a.what"></div>
                    <div class="text-[10.5px] text-gray-400 mt-0.5">
                      <span x-text="a.when"></span> ·
                      <span class="font-medium" x-text="a.channel"></span> ·
                      <span x-text="a.basis"></span>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Previous cycles. The evidence behind the stale-confirmation spot check. -->
        <template x-if="pane === 'Previous cycles'">
          <div class="scroll flex-1 overflow-y-auto p-4">
            <div class="text-[11px] text-gray-500 leading-relaxed mb-3">
              What this line did in earlier cycles.
            </div>
            <div class="rounded-lg border border-gray-200 overflow-hidden">
              <template x-for="h in history" :key="h.cycle">
                <div class="px-3 py-2.5 border-b border-gray-100 last:border-0">
                  <div class="flex items-center justify-between">
                    <span class="text-[12px] font-medium text-slate-800" x-text="h.cycle"></span>
                    <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200" x-text="h.answer"></span>
                  </div>
                  <div class="text-[11px] text-gray-500 mt-0.5">
                    <span x-text="h.value"></span> · <span x-text="h.by"></span>
                  </div>
                </div>
              </template>
            </div>
            <div class="mt-3 rounded-lg bg-amber-50 border border-amber-200 px-3 py-2.5 text-[11.5px] text-amber-900 leading-relaxed">
              Same value three cycles running, supplier field untouched since March 2024.
            </div>
          </div>
        </template>
      </aside>
    </div>
  </div>
</div>

<script>
function respond() {
  return {
    real: null, route: null, poValue: null, pane: 'Thread',

    facts: [
      { k: 'Yearly value',    v: '€ 96,000' },
      { k: 'Contract ends',   v: '28 Feb 2027' },
      { k: 'Method on file',  v: 'Direct Negotiation' },
      { k: 'Decision by',     v: '2 Jan 2027', tone: 'text-rose-600' }
    ],

    realOptions: [
      { k: 'confirm', label: 'Confirm as planned', hint: 'Nothing has changed' },
      { k: 'changes', label: 'Needs changes',      hint: 'Value, timing, scope or supplier' },
      { k: 'notmine', label: 'Not mine',           hint: 'Pass it to the right person' },
      { k: 'cancel',  label: 'Cancel',             hint: 'Reason required' }
    ],
    routeOptions: [
      { k: 'renewal',   label: 'Renewal of an expiring contract', hint: 'Same supplier, same scope' },
      { k: 'addendum',  label: 'Addendum to an active contract',  hint: 'Extending or varying what exists' },
      { k: 'new',       label: 'New good or service, no contract',hint: 'Nothing in place today' },
      { k: 'framework', label: 'A framework agreement covers it', hint: 'Already under a group agreement' }
    ],
    changeFields: [
      { k: 'New yearly value', v: '€ 96,000' },
      { k: 'New contract end', v: '28/02/2027' },
      { k: 'Supplier',         v: 'Grafana Labs' },
      { k: 'What changed and why', v: '' }
    ],

    thread: [
      { i: 1, who: 'ellie', init: 'E', meta: 'Ellie · 22 Sep, 08:15 · sent by email',
        body: 'This contract ends 28 February 2027. A decision is needed by <strong>2 January</strong> to keep the standard process.' },
      { i: 2, who: 'bu', init: 'AC', meta: 'Alessandro Conti · 29 Sep, 16:40 · email reply',
        body: 'We will probably renew but the volume is coming down, maybe 20 percent.' },
      { i: 3, who: 'ellie', init: 'E', meta: 'Ellie · 29 Sep, 16:41 · confidence: medium',
        body: 'I read that as <strong>renewal with changes</strong> and a value around <strong>€ 77,000</strong>. Two things I need before this passes validation:<br>• Is the framework agreement with Grafana the one this sits under?<br>• At € 96,000 the recorded method is Direct Negotiation, which needs authorization. Do you expect to justify it, or should this be a tender?' },
      { i: 4, who: 'proc', init: 'GR', meta: 'Giulia Rinaldi, Procurement · 30 Sep, 09:12 · in the platform',
        body: 'Alessandro, the group agreement covers Grafana Cloud but not the self-managed licences. Worth checking which you are on before answering.' }
    ],

    audit: [
      { i: 1, what: 'Line imported from Purchasing Plan master, row 2,431', when: '4 Aug 2026', channel: 'Import', basis: 'file, mapped by Procurement', tone: 'bg-slate-300' },
      { i: 2, what: 'Assigned to <strong>Alessandro Conti</strong> for cycle 2027H1', when: '22 Sep 2026', channel: 'Agent', basis: 'from owner field in the plan', tone: 'bg-indigo-400' },
      { i: 3, what: 'Request sent, one email with a button per answer', when: '22 Sep 2026', channel: 'Email', basis: 'sent to alessandro.conti@sisalgaming.com', tone: 'bg-indigo-400' },
      { i: 4, what: 'Email reply read as <strong>needs changes</strong>, value € 77,000', when: '29 Sep 2026', channel: 'Email reply', basis: 'from the owner\'s mailbox', tone: 'bg-amber-400' },
      { i: 5, what: 'Challenge raised: direct negotiation at this value needs authorization', when: '29 Sep 2026', channel: 'Agent', basis: 'sourcing strategy and value', tone: 'bg-amber-400' },
      { i: 6, what: 'Comment added by <strong>Giulia Rinaldi</strong>, Procurement', when: '30 Sep 2026', channel: 'Platform', basis: 'signed in with Microsoft', tone: 'bg-emerald-400' }
    ],

    history: [
      { cycle: 'Cycle 2026 H2', answer: 'Confirmed', value: '€ 96,000', by: 'answered by email link' },
      { cycle: 'Cycle 2026 H1', answer: 'Confirmed', value: '€ 96,000', by: 'answered by email link' },
      { cycle: 'Cycle 2025 H2', answer: 'Confirmed', value: '€ 96,000', by: 'workbook returned' }
    ],

    pickReal(k) { this.real = k; if (k !== 'confirm' && k !== 'changes') { this.route = null; this.poValue = null; } },
    pickRoute(k) { this.route = k; if (k !== 'framework') this.poValue = null; },
    canSubmit() {
      if (this.real === 'cancel' || this.real === 'notmine') return true;
      if (this.real === 'confirm' || this.real === 'changes') {
        if (!this.route) return false;
        if (this.route === 'framework' && !this.poValue) return false;
        return true;
      }
      return false;
    }
  };
}
</script>
</body>
</html>
